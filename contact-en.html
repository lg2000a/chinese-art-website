<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Jin Mo Realm</title>
    <meta name="description" content="Contact Jin Mo Realm to inquire about original artworks, commissions, or exhibitions.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jin Mo Realm 金墨境界">

  <meta property="og:title" content="Contact — Jin Mo Realm">
  <meta property="og:description" content="Get in touch with Jin Mo Realm to inquire about original artworks, commissions, or collaborations.">
  <meta property="og:image" content="https://www.shuhua.homes/images/og-cover.jpg">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact — Jin Mo Realm">
  <meta name="twitter:description" content="Get in touch with Jin Mo Realm to inquire about original artworks, commissions, or collaborations.">
  <meta name="twitter:image" content="https://www.shuhua.homes/images/og-cover.jpg">
  <link rel="canonical" href="https://www.shuhua.homes/contact-en.html">
  <link rel="alternate" hreflang="en" href="https://www.shuhua.homes/contact-en.html">
  <link rel="alternate" hreflang="zh-CN" href="https://www.shuhua.homes/contact.html">
  <link rel="alternate" hreflang="x-default" href="https://www.shuhua.homes/index-en.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1a1814;--paper:#f5f1eb;--paper-deep:#ede8df;--vermillion:#c0392b;--gold:#b8964a;--mist:#8a8278;--stroke:rgba(26,24,20,0.12);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'EB Garamond',Georgia,serif;background:var(--paper);color:var(--ink);overflow-x:hidden;}

    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.6rem 4rem;background:rgba(245,241,235,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--stroke);}
    .nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:300;letter-spacing:0.18em;color:var(--ink);text-decoration:none;}
    .nav-logo span{display:block;font-size:0.65rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--mist);margin-top:2px;}
    .nav-links{display:flex;gap:3rem;list-style:none;align-items:center;}
    .nav-links a{font-size:0.78rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--mist);text-decoration:none;transition:color 0.3s;}
    .nav-links a:hover,.nav-links a.active{color:var(--ink);}
    .nav-lang{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--vermillion);text-decoration:none;border:1px solid var(--vermillion);padding:0.35rem 0.85rem;transition:all 0.3s;}
    .nav-lang:hover{background:var(--vermillion);color:white;}

    .contact-layout{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}

    .contact-left{padding:10rem 5rem 6rem 6rem;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:center;}
    .eyebrow{font-size:0.7rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:2rem;}
    .contact-title{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,4.5vw,4.5rem);font-weight:300;line-height:1.12;margin-bottom:2rem;}
    .contact-desc{font-size:1.05rem;line-height:1.95;color:rgba(245,241,235,0.6);max-width:380px;}

    .contact-right{padding:10rem 6rem 6rem 5rem;display:flex;flex-direction:column;justify-content:center;}

    .contact-form{display:flex;flex-direction:column;gap:1.4rem;}
    .form-field{display:flex;flex-direction:column;gap:0.5rem;}
    .form-field label{font-size:0.68rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--mist);}
    .form-field input,.form-field textarea{font-family:'EB Garamond',Georgia,serif;font-size:1.05rem;background:transparent;border:none;border-bottom:1px solid var(--stroke);padding:0.7rem 0;color:var(--ink);transition:border-color 0.3s;outline:none;resize:none;}
    .form-field input:focus,.form-field textarea:focus{border-bottom-color:var(--ink);}
    .form-field input::placeholder,.form-field textarea::placeholder{color:var(--mist);font-style:italic;}
    .form-submit{margin-top:1.5rem;align-self:flex-start;font-family:'EB Garamond',Georgia,serif;font-size:0.72rem;letter-spacing:0.28em;text-transform:uppercase;color:white;background:var(--ink);border:none;padding:1rem 2.5rem;cursor:pointer;transition:background 0.3s;}
    .form-submit:hover{background:var(--vermillion);}
    .form-note{font-size:0.85rem;color:var(--mist);font-style:italic;min-height:1.4em;}
    .form-note.success{color:#4a7c59;font-style:normal;}
    .error-msg{font-size:0.75rem;color:var(--vermillion);margin-top:0.3rem;min-height:1em;letter-spacing:0.05em;}
    .form-field input.invalid,.form-field textarea.invalid{border-bottom-color:var(--vermillion);}
    .form-field input.valid,.form-field textarea.valid{border-bottom-color:#4a7c59;}

    footer{border-top:1px solid var(--stroke);padding:2rem 6rem;display:flex;justify-content:space-between;align-items:center;}
    .footer-copy{font-size:0.75rem;letter-spacing:0.12em;color:var(--mist);}
    .footer-logo{font-family:'Cormorant Garamond',serif;font-size:0.9rem;font-weight:300;letter-spacing:0.2em;color:var(--mist);}

    @media(max-width:900px){
      nav{padding:1.2rem 2rem;}
      .contact-layout{grid-template-columns:1fr;}
      .contact-left{padding:8rem 2.5rem 4rem;}
      .contact-right{padding:4rem 2.5rem 5rem;}
      footer{padding:1.5rem 2.5rem;flex-direction:column;gap:0.8rem;text-align:center;}
    }
    @media(max-width:600px){
      .nav-links{display:none;}
      .contact-left{padding:7rem 1.5rem 3rem;}
      .contact-right{padding:3rem 1.5rem 4rem;}
      footer{padding:1.5rem;}
    }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index-en.html">Jin Mo Realm<span>金 墨 境 界</span></a>
  <ul class="nav-links">
    <li><a href="index-en.html">Home</a></li>
    <li><a href="gallery-en.html">Works</a></li>
    <li><a href="about-en.html">About</a></li>
    <li><a href="contact-en.html" class="active">Contact</a></li>
  </ul>
  <a class="nav-lang" href="contact.html">中文</a>
</nav>

<div class="contact-layout">
  <div class="contact-left">
    <p class="eyebrow">Get in Touch</p>
    <h1 class="contact-title">Let's begin<br>a conversation</h1>
    <p class="contact-desc">For exhibitions, acquisitions, commissions, or any creative inquiry — a message is always welcome. Your details stay between us.</p>
  </div>
  <div class="contact-right">
    <form class="contact-form" id="contactForm">
      <div class="form-field">
        <label for="f-name">Your Name</label>
        <input type="text" id="f-name" name="name" placeholder="Full name" autocomplete="name">
        <span class="error-msg" id="err-name"></span>
      </div>
      <div class="form-field">
        <label for="f-email">Email Address</label>
        <input type="email" id="f-email" name="email" placeholder="your@email.com" autocomplete="email">
        <span class="error-msg" id="err-email"></span>
      </div>
      <div class="form-field">
        <label for="f-subject">Subject</label>
        <input type="text" id="f-subject" name="subject" placeholder="Exhibition / Acquisition / Other">
        <span class="error-msg" id="err-subject"></span>
      </div>
      <div class="form-field">
        <label for="f-message">Message</label>
        <textarea id="f-message" name="message" rows="5" placeholder="Your inquiry…"></textarea>
        <span class="error-msg" id="err-message"></span>
      </div>
      <p class="form-note" id="formNote"></p>
      <button type="submit" class="form-submit">Send Message</button>
    </form>
  </div>
</div>

<footer>
  <span class="footer-copy">© 2026 Jin Mo Realm. All rights reserved.</span>
  <span class="footer-logo">金 墨 境 界</span>
</footer>

<script>
  const rules = {
    name:    { min: 2,  msg: 'Please enter your name (at least 2 characters).' },
    email:   { regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, msg: 'Please enter a valid email address.' },
    message: { min: 10, msg: 'Please write a message (at least 10 characters).' }
  };

  function validate(field, value) {
    if (field === 'email') return rules.email.regex.test(value) ? '' : rules.email.msg;
    if (field === 'name')    return value.length >= rules.name.min    ? '' : rules.name.msg;
    if (field === 'message') return value.length >= rules.message.min ? '' : rules.message.msg;
    return '';
  }

  function applyState(input, errEl, error) {
    if (error) {
      input.classList.add('invalid'); input.classList.remove('valid');
      errEl.textContent = error;
    } else {
      input.classList.remove('invalid'); input.classList.add('valid');
      errEl.textContent = '';
    }
    return !error;
  }

  ['name','email','message'].forEach(function(field) {
    const el = document.getElementById('f-' + field);
    el.addEventListener('blur', function() {
      applyState(el, document.getElementById('err-' + field), validate(field, el.value.trim()));
    });
    el.addEventListener('input', function() {
      if (el.classList.contains('invalid'))
        applyState(el, document.getElementById('err-' + field), validate(field, el.value.trim()));
    });
  });

  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const nameVal  = document.getElementById('f-name').value.trim();
    const emailVal = document.getElementById('f-email').value.trim();
    const subVal   = document.getElementById('f-subject').value.trim() || 'Inquiry';
    const msgVal   = document.getElementById('f-message').value.trim();

    const ok = [
      applyState(document.getElementById('f-name'),    document.getElementById('err-name'),    validate('name',    nameVal)),
      applyState(document.getElementById('f-email'),   document.getElementById('err-email'),   validate('email',   emailVal)),
      applyState(document.getElementById('f-message'), document.getElementById('err-message'), validate('message', msgVal))
    ].every(Boolean);

    if (!ok) {
      document.getElementById('formNote').textContent = 'Please correct the fields above.';
      document.getElementById('formNote').className = 'form-note';
      return;
    }

    const to   = atob('YWxleDgyMDI2OEBnbWFpbC5jb20=');
    const subj = encodeURIComponent('[Jin Mo Realm] ' + subVal + ' — from ' + nameVal);
    const body = encodeURIComponent('Name: ' + nameVal + '\nEmail: ' + emailVal + '\n\n' + msgVal);
    window.location.href = 'mailto:' + to + '?subject=' + subj + '&body=' + body;

    const note = document.getElementById('formNote');
    note.textContent = 'Opening your mail client — thank you for reaching out.';
    note.className = 'form-note success';
  });
</script>
</body>
</html>
