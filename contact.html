<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我 — 金墨境界</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1a1814;--paper:#f5f1eb;--paper-deep:#ede8df;--vermillion:#c0392b;--gold:#b8964a;--mist:#8a8278;--stroke:rgba(26,24,20,0.12);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Serif SC','Source Han Serif SC',STSong,serif;background:var(--paper);color:var(--ink);overflow-x:hidden;}

    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.6rem 4rem;background:rgba(245,241,235,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--stroke);}
    .nav-logo{font-family:'Noto Serif SC',serif;font-size:1.3rem;font-weight:300;letter-spacing:0.25em;color:var(--ink);text-decoration:none;}
    .nav-logo span{display:block;font-family:'Noto Sans SC',sans-serif;font-size:0.6rem;letter-spacing:0.35em;color:var(--mist);margin-top:3px;font-weight:300;}
    .nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center;}
    .nav-links a{font-family:'Noto Sans SC',sans-serif;font-size:0.8rem;font-weight:300;letter-spacing:0.15em;color:var(--mist);text-decoration:none;transition:color 0.3s;}
    .nav-links a:hover,.nav-links a.active{color:var(--ink);}
    .nav-lang{font-family:'Noto Sans SC',sans-serif;font-size:0.7rem;letter-spacing:0.15em;color:var(--vermillion);text-decoration:none;border:1px solid var(--vermillion);padding:0.35rem 0.85rem;transition:all 0.3s;}
    .nav-lang:hover{background:var(--vermillion);color:white;}

    .contact-layout{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}

    .contact-left{padding:10rem 5rem 6rem 6rem;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:center;}
    .eyebrow{font-family:'Noto Sans SC',sans-serif;font-size:0.68rem;font-weight:300;letter-spacing:0.5em;color:var(--gold);margin-bottom:2rem;}
    .contact-title{font-family:'Noto Serif SC',serif;font-size:clamp(2.8rem,4vw,4rem);font-weight:300;line-height:1.5;letter-spacing:0.18em;margin-bottom:2rem;}
    .contact-desc{font-family:'Noto Sans SC',sans-serif;font-size:0.88rem;font-weight:300;line-height:2.2;color:rgba(245,241,235,0.6);letter-spacing:0.06em;}

    .contact-right{padding:10rem 6rem 6rem 5rem;display:flex;flex-direction:column;justify-content:center;}

    .contact-form{display:flex;flex-direction:column;gap:1.4rem;}
    .form-field{display:flex;flex-direction:column;gap:0.5rem;}
    .form-field label{font-family:'Noto Sans SC',sans-serif;font-size:0.65rem;font-weight:300;letter-spacing:0.3em;color:var(--mist);}
    .form-field input,.form-field textarea{font-family:'Noto Serif SC',serif;font-size:1rem;background:transparent;border:none;border-bottom:1px solid var(--stroke);padding:0.7rem 0;color:var(--ink);transition:border-color 0.3s;outline:none;resize:none;}
    .form-field input:focus,.form-field textarea:focus{border-bottom-color:var(--ink);}
    .form-field input::placeholder,.form-field textarea::placeholder{color:var(--mist);}
    .form-submit{margin-top:1.5rem;align-self:flex-start;font-family:'Noto Sans SC',sans-serif;font-size:0.72rem;font-weight:300;letter-spacing:0.3em;color:white;background:var(--ink);border:none;padding:1rem 2.5rem;cursor:pointer;transition:background 0.3s;}
    .form-submit:hover{background:var(--vermillion);}
    .form-note{font-family:'Noto Sans SC',sans-serif;font-size:0.82rem;font-weight:300;color:var(--mist);font-style:italic;min-height:1.4em;}

    footer{border-top:1px solid var(--stroke);padding:2rem 6rem;display:flex;justify-content:space-between;align-items:center;}
    .footer-copy{font-family:'Noto Sans SC',sans-serif;font-size:0.72rem;font-weight:300;letter-spacing:0.12em;color:var(--mist);}
    .footer-logo{font-family:'Noto Serif SC',serif;font-size:0.9rem;font-weight:300;letter-spacing:0.3em;color:var(--mist);}

    @media(max-width:900px){
      nav{padding:1.2rem 2rem;}
      .contact-layout{grid-template-columns:1fr;}
      .contact-left{padding:8rem 2.5rem 4rem;}
      .contact-right{padding:4rem 2.5rem 5rem;}
      footer{padding:1.5rem 2.5rem;flex-direction:column;gap:0.8rem;text-align:center;}
    }
    @media(max-width:600px){
      .nav-links{display:none;}
      .contact-left{padding:7rem 1.5rem 3rem;}
      .contact-right{padding:3rem 1.5rem 4rem;}
      footer{padding:1.5rem;}
    }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index-zh.html">金墨境界<span>Jin Mo Realm · Chinese Art</span></a>
  <ul class="nav-links">
    <li><a href="index-zh.html">首页</a></li>
    <li><a href="gallery.html">作品集</a></li>
    <li><a href="about.html">关于我</a></li>
    <li><a href="contact.html" class="active">联系我</a></li>
  </ul>
  <a class="nav-lang" href="contact-en.html">English</a>
</nav>

<div class="contact-layout">
  <div class="contact-left">
    <p class="eyebrow">联系我</p>
    <h1 class="contact-title">期待<br>与您<br>对话</h1>
    <p class="contact-desc">如有合作、展览或作品咨询，欢迎随时与我联系。您的信息将得到妥善保护。</p>
  </div>
  <div class="contact-right">
    <form class="contact-form" id="contactForm">
      <div class="form-field">
        <label>您的姓名</label>
        <input type="text" name="name" placeholder="请输入您的姓名" required>
      </div>
      <div class="form-field">
        <label>电子邮箱</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-field">
        <label>咨询主题</label>
        <input type="text" name="subject" placeholder="展览 / 收藏 / 合作 / 其他">
      </div>
      <div class="form-field">
        <label>留言内容</label>
        <textarea name="message" rows="5" placeholder="请输入您的留言或合作意向…" required></textarea>
      </div>
      <p class="form-note" id="formNote"></p>
      <button type="submit" class="form-submit">发送消息</button>
    </form>
  </div>
</div>

<footer>
  <span class="footer-copy">版权所有 © 2026 金墨境界</span>
  <span class="footer-logo">金 墨 境 界</span>
</footer>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name    = this.name.value.trim();
    const email   = this.email.value.trim();
    const subject = this.subject.value.trim() || '合作咨询';
    const msg     = this.message.value.trim();
    const to      = atob('YWxleDgyMDI2OEBnbWFpbC5jb20=');
    const subj    = encodeURIComponent('【金墨境界】' + subject + ' — ' + name);
    const body    = encodeURIComponent('姓名：' + name + '\n邮箱：' + email + '\n\n' + msg);
    window.location.href = 'mailto:' + to + '?subject=' + subj + '&body=' + body;
    document.getElementById('formNote').textContent = '正在打开邮件客户端…';
  });
</script>
</body>
</html>
